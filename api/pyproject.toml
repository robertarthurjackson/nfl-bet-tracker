[project]
name = "nflbet"
version = "0.1.0"
description = "Personal NFL +EV bet tracker: sharp-line devig, fractional Kelly, CLV tracking"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nflbet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
